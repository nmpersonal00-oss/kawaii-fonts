<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#fff5fc">
  <meta name="description" content="Petaltype: a warm neon pink and lavender copy-and-paste lettering studio.">
  <title>Petaltype ♡ Pretty Font Studio</title>
  <style>

    :root {
      --bg: #fff5fc;
      --bg-2: #f7efff;
      --paper: rgba(255, 251, 255, 0.88);
      --paper-strong: rgba(255, 253, 255, 0.96);
      --inner: rgba(255, 247, 252, 0.93);
      --ink: #664872;
      --muted: #9e84aa;
      --pale: #c4accf;
      --line: rgba(234, 197, 227, 0.72);
      --pink: #ff73bd;
      --pink-soft: #ffd3ee;
      --pink-deep: #d94f9f;
      --violet: #b286ff;
      --violet-soft: #e9ddff;
      --white-glow: rgba(255,255,255,0.95);
      --focus: #d98cff;
      --shadow: 0 18px 48px rgba(233, 111, 188, 0.13), 0 10px 30px rgba(164, 110, 255, 0.10);
      --glow: 0 0 0 1px rgba(255,255,255,0.75), 0 0 22px rgba(255, 126, 200, 0.14), 0 0 40px rgba(179, 143, 255, 0.11);
    }
    * { box-sizing: border-box; }
    html { scrollbar-color: #efbfe1 transparent; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 5%, rgba(255, 172, 220, 0.55) 0%, rgba(255, 172, 220, 0.0) 28%),
        radial-gradient(circle at 90% 12%, rgba(202, 168, 255, 0.42) 0%, rgba(202, 168, 255, 0.0) 24%),
        radial-gradient(circle at 82% 88%, rgba(255, 192, 231, 0.40) 0%, rgba(255, 192, 231, 0.0) 22%),
        linear-gradient(180deg, #fff8fd 0%, #fff2fb 42%, #f8f0ff 100%);
      font-family: ui-rounded, "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(255,255,255,0.28), rgba(255,255,255,0));
      opacity: .9;
    }
    button,textarea { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible,textarea:focus-visible { outline: 3px solid rgba(217, 140, 255, 0.55); outline-offset: 3px; }
    .shell { width: min(1160px, calc(100% - 44px)); margin: 0 auto; padding: 30px 0 42px; position: relative; z-index: 1; }
    header { display: flex; align-items: center; justify-content: center; padding: 0 0 27px; }
    .logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 12px 18px;
      border-radius: 999px;
      background: rgba(255,255,255,0.6);
      border: 1px solid rgba(255,255,255,0.78);
      box-shadow: var(--glow);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .flower { width: 38px; height: 38px; flex: none; filter: drop-shadow(0 0 10px rgba(255, 145, 204, 0.35)); }
    .wordmark {
      font-family: ui-rounded, "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
      font-weight: 900;
      font-size: 29px;
      letter-spacing: -1.55px;
      line-height: 1;
      color: #8e63ba;
      text-shadow: 0 0 16px rgba(255, 137, 210, 0.18);
    }
    .wordmark span { color: #ff71ba; }
    .studio { display: grid; grid-template-columns: minmax(0, .83fr) minmax(0, 1.17fr); gap: 18px; align-items: start; }
    .panel {
      min-width: 0;
      border-radius: 24px;
      border: 1px solid rgba(255,255,255,0.82);
      background: linear-gradient(180deg, var(--paper-strong) 0%, var(--paper) 100%);
      box-shadow: var(--shadow), var(--glow);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }
    .input-panel { padding: 24px; }
    .output-panel { padding: 23px 23px 20px; }
    .heading { margin: 0 0 17px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    h1,h2 {
      margin: 0;
      color: #7f5a96;
      font-size: 18px;
      line-height: 1.3;
      font-weight: 800;
      letter-spacing: -.32px;
    }
    .count {
      font-size: 12px;
      color: var(--muted);
      font-weight: 800;
      white-space: nowrap;
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(255, 243, 251, 0.9);
      border: 1px solid rgba(243, 207, 232, 0.85);
      box-shadow: 0 0 14px rgba(255, 157, 213, 0.10);
    }
    textarea {
      width: 100%;
      min-height: 375px;
      padding: 18px 19px;
      display: block;
      resize: vertical;
      border: 1px solid rgba(236, 201, 229, 0.9);
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(255,255,255,0.95), rgba(255,247,252,0.95));
      color: var(--ink);
      font-size: 23px;
      line-height: 1.55;
      outline: 0;
      caret-color: var(--pink-deep);
      box-shadow: inset 0 1px 2px rgba(188, 100, 171, .03), 0 0 0 1px rgba(255,255,255,0.5);
    }
    textarea::placeholder { color: #c6abcf; }
    textarea:focus {
      border-color: rgba(245, 124, 191, 0.9);
      box-shadow: 0 0 0 4px rgba(255, 136, 205, .12), 0 0 20px rgba(198, 140, 255, 0.12);
    }
    .editor-footer { display: flex; align-items: center; justify-content: flex-end; padding-top: 13px; }
    .clear {
      background: rgba(255,244,250,0.84);
      color: #956eaa;
      border: 1px solid rgba(240, 201, 226, 0.9);
      padding: 8px 13px;
      font-size: 13px;
      font-weight: 800;
      border-radius: 999px;
      box-shadow: 0 0 16px rgba(255, 164, 218, 0.08);
    }
    .clear:hover { color: #7d5594; background: rgba(255, 234, 246, 0.98); }
    .scroll-box {
      max-height: min(72vh, 690px);
      overflow: auto;
      padding-right: 7px;
      scrollbar-width: thin;
      scrollbar-color: #efbfe1 transparent;
      overscroll-behavior: contain;
    }
    .result {
      padding: 16px 5px 17px 2px;
      border-bottom: 1px solid rgba(239, 224, 244, 0.95);
    }
    .result:first-child { padding-top: 4px; }
    .result:last-child { border-bottom: 0; }
    .meta { display: flex; align-items: center; gap: 8px; min-width: 0; margin-bottom: 7px; }
    .font-label { color: #a15ea1; font-weight: 800; font-size: 12px; letter-spacing: .04px; }
    .weight-label { font-weight: 700; font-size: 11px; color: #b78bc0; }
    .dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: linear-gradient(180deg, #ff82c5, #c892ff);
      flex: none;
      box-shadow: 0 0 8px rgba(255, 130, 197, 0.45);
    }
    .result-main { display: flex; align-items: center; gap: 12px; }
    .preview {
      margin: 0;
      min-width: 0;
      flex: 1;
      color: #563f64;
      font-family: "Segoe UI Symbol", "Noto Sans Math", "Cambria Math", "Apple Symbols", system-ui, sans-serif;
      font-size: 23px;
      line-height: 1.5;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      user-select: text;
    }
    .preview.placeholder { font-family: inherit; color: var(--pale); font-size: 14px; }
    .copy {
      flex: none;
      align-self: center;
      min-width: 73px;
      padding: 9px 14px;
      background: linear-gradient(180deg, rgba(255, 228, 243, 0.98), rgba(240, 230, 255, 0.98));
      border: 1px solid rgba(242, 198, 231, 0.95);
      border-radius: 12px;
      color: #9857a2;
      font-weight: 800;
      font-size: 12px;
      box-shadow: 0 0 18px rgba(255, 162, 220, 0.12);
      transition: transform .16s ease, background .16s ease, border-color .16s ease, color .16s ease, box-shadow .16s ease;
    }
    .copy:hover:not(:disabled) {
      background: linear-gradient(180deg, rgba(255, 217, 236, 1), rgba(233, 219, 255, 1));
      border-color: rgba(238, 171, 218, 1);
      color: #88478f;
      box-shadow: 0 0 22px rgba(255, 150, 213, 0.20);
      transform: translateY(-1px);
    }
    .copy.copied {
      background: linear-gradient(180deg, rgba(232, 217, 255, 1), rgba(255, 222, 241, 1));
      border-color: rgba(205, 175, 242, 1);
      color: #76469e;
      box-shadow: 0 0 20px rgba(186, 145, 255, 0.18);
    }
    .copy:disabled { opacity: .48; cursor: not-allowed; }
    .toast {
      position: fixed;
      z-index: 10;
      bottom: 24px;
      left: 50%;
      transform: translate(-50%, 12px);
      background: linear-gradient(180deg, rgba(136, 92, 171, 0.95), rgba(110, 74, 146, 0.97));
      color: #fff8ff;
      padding: 10px 17px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 800;
      box-shadow: 0 10px 35px rgba(148, 98, 193, .25), 0 0 22px rgba(255, 138, 204, .16);
      border: 1px solid rgba(255,255,255,0.35);
      opacity: 0;
      pointer-events: none;
      transition: opacity .17s ease, transform .17s ease;
    }
    .toast.show { transform: translate(-50%, 0); opacity: 1; }
    @media(max-width: 780px) {
      .shell { width: min(600px, calc(100% - 28px)); padding-top: 23px; }
      header { padding-bottom: 23px; }
      .studio { grid-template-columns: 1fr; gap: 15px; }
      .input-panel, .output-panel { padding: 20px; }
      textarea { min-height: 143px; font-size: 20px; }
      .scroll-box { max-height: 66vh; }
    }
    @media(max-width: 420px) {
      .shell { width: calc(100% - 22px); }
      .wordmark { font-size: 26px; }
      .flower { width: 34px; height: 34px; }
      .panel { border-radius: 20px; }
      .input-panel,.output-panel { padding: 18px 15px; }
      .scroll-box { padding-right: 3px; }
      .preview { font-size: 21px; }
      .result { padding-right: 1px; }
      .copy { min-width: 64px; padding: 8px 10px; }
    }
    @media(prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="logo" aria-label="Petaltype">
        <svg class="flower" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" aria-hidden="true">
          <g fill="#dfa5cc">
            <ellipse cx="24" cy="12" rx="7.6" ry="9.4"/>
            <ellipse cx="35.4" cy="20.1" rx="7.6" ry="9.4" transform="rotate(72 35.4 20.1)"/>
            <ellipse cx="31" cy="33.7" rx="7.6" ry="9.4" transform="rotate(144 31 33.7)"/>
            <ellipse cx="17" cy="33.7" rx="7.6" ry="9.4" transform="rotate(216 17 33.7)"/>
            <ellipse cx="12.6" cy="20.1" rx="7.6" ry="9.4" transform="rotate(288 12.6 20.1)"/>
          </g>
          <circle cx="24" cy="24" r="8" fill="#f7e1a7"/>
          <circle cx="21.5" cy="23.4" r="1" fill="#c49a79"/><circle cx="26.4" cy="23.4" r="1" fill="#c49a79"/>
          <path d="M22 26.6q2 2 4 0" stroke="#c49a79" stroke-width="1.1" fill="none" stroke-linecap="round"/>
        </svg>
        <div class="wordmark">petal<span>type</span></div>
      </div>
    </header>
    <main class="studio">
      <section class="panel input-panel" aria-labelledby="words-title">
        <div class="heading"><h1 id="words-title">Your words</h1></div>
        <textarea id="words" aria-label="Type your words" maxlength="500" spellcheck="false" placeholder="Type something pretty...">Hello, lovely!</textarea>
        <div class="editor-footer"><button id="clear" type="button" class="clear">Clear</button></div>
      </section>
      <section class="panel output-panel" aria-labelledby="fonts-title">
        <div class="heading"><h2 id="fonts-title">Pretty fonts</h2><span class="count" id="count"></span></div>
        <div id="results" class="scroll-box" aria-label="Scroll through styles and copy your favorite text"></div>
      </section>
    </main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script>
    (() => {
      'use strict';
      const input = document.getElementById('words');
      const container = document.getElementById('results');
      const count = document.getElementById('count');
      const toast = document.getElementById('toast');
      const AZ = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      const az = 'abcdefghijklmnopqrstuvwxyz';
      const nums = '0123456789';
      const range = (start, n=26) => Array.from({length:n},(_,i)=>String.fromCodePoint(start+i));
      const chars = Array.from;
      const mapAlphabet = (upper,lower,digits=null,exceptions={}) => {
        const map = new Map();
        chars(AZ).forEach((c,i)=>map.set(c,chars(upper)[i]||c));
        chars(az).forEach((c,i)=>map.set(c,chars(lower)[i]||c));
        if(digits) chars(nums).forEach((c,i)=>map.set(c,chars(digits)[i]||c));
        Object.entries(exceptions).forEach(([k,v])=>map.set(k,v));
        return text => chars(text).map(c=>map.get(c)||c).join('');
      };
      const seq = (u,l,d=null) => mapAlphabet(range(u),range(l),d===null?null:range(d,10));
      const normal = text => text;
      const scriptUpper = '𝒜ℬ𝒞𝒟ℰℱ𝒢ℋℐ𝒥𝒦ℒℳ𝒩𝒪𝒫𝒬ℛ𝒮𝒯𝒰𝒱𝒲𝒳𝒴𝒵';
      const scriptLower = '𝒶𝒷𝒸𝒹ℯ𝒻ℊ𝒽𝒾𝒿𝓀𝓁𝓂𝓃ℴ𝓅𝓆𝓇𝓈𝓉𝓊𝓋𝓌𝓍𝓎𝓏';
      const gothicUpper = '𝔄𝔅ℭ𝔇𝔈𝔉𝔊ℌℑ𝔍𝔎𝔏𝔐𝔑𝔒𝔓𝔔ℜ𝔖𝔗𝔘𝔙𝔚𝔛𝔜ℨ';
      const outlinedUpper = '𝔸𝔹ℂ𝔻𝔼𝔽𝔾ℍ𝕀𝕁𝕂𝕃𝕄ℕ𝕆ℙℚℝ𝕊𝕋𝕌𝕍𝕎𝕏𝕐ℤ';

      // Unicode lettering rather than a CSS-only display font: each result
      // stays stylized when pasted into apps that support these characters.
      const families = [
        {name:'Sweet script', regular:mapAlphabet(scriptUpper,scriptLower), bold:seq(0x1D4D0,0x1D4EA)},
        {name:'Dainty italic',regular:mapAlphabet(range(0x1D434),range(0x1D44E),null,{h:'ℎ'}),bold:seq(0x1D468,0x1D482)},
        {name:'Soft sans',regular:seq(0x1D5A0,0x1D5BA,0x1D7E2),bold:seq(0x1D5D4,0x1D5EE,0x1D7EC)},
        {name:'Dreamy sans italic',regular:seq(0x1D608,0x1D622),bold:seq(0x1D63C,0x1D656)},
        {name:'Classic serif',regular:normal,bold:seq(0x1D400,0x1D41A,0x1D7CE)},
        {name:'Vintage gothic',regular:mapAlphabet(gothicUpper,range(0x1D51E)),bold:seq(0x1D56C,0x1D586)}
      ];
      const titleCase = s => s.toLowerCase().replace(/(^|[^A-Za-z])([a-z])/g,(_m,pre,c)=>pre+c.toUpperCase());
      const letterspace = (text, spaces) => text.replace(/[A-Za-z0-9]+/g,word=>chars(word).join(' '.repeat(spaces)));
      const variants = [
        {name:'', change:s=>s},
        {name:'Airy',change:s=>letterspace(s,1)},
        {name:'Title case',change:titleCase},
        {name:'Uppercase',change:s=>s.toUpperCase()},
        {name:'Title airy',change:s=>letterspace(titleCase(s),1)},
        {name:'Caps airy',change:s=>letterspace(s.toUpperCase(),1)},
        {name:'Extra airy',change:s=>letterspace(s,2)}
      ];
      const specialty = [
        {name:'Outlined', fn:mapAlphabet(outlinedUpper,range(0x1D552),range(0x1D7D8,10))},
        {name:'Typewriter',fn:seq(0x1D670,0x1D68A,0x1D7F6)},
        {name:'Wide letters',fn:seq(0xFF21,0xFF41,0xFF10)},
        {name:'Little caps',fn:mapAlphabet('ᴀʙᴄᴅᴇꜰɢʜɪᴊᴋʟᴍɴᴏᴘǫʀꜱᴛᴜᴠᴡxʏᴢ','ᴀʙᴄᴅᴇꜰɢʜɪᴊᴋʟᴍɴᴏᴘǫʀꜱᴛᴜᴠᴡxʏᴢ')},
        {name:'Tiny letters',fn:mapAlphabet('ᴬᴮᶜᴰᴱᶠᴳᴴᴵᴶᴷᴸᴹᴺᴼᴾᑫᴿˢᵀᵁⱽᵂˣʸᶻ','ᵃᵇᶜᵈᵉᶠᵍʰⁱʲᵏˡᵐⁿᵒᵖᑫʳˢᵗᵘᵛʷˣʸᶻ')},
        {name:'Petite wide',fn:mapAlphabet('ＡＢＣＤＥＦＧＨＩＪＫＬＭＮＯＰＱＲＳＴＵＶＷＸＹＺ','ａｂｃｄｅｆｇｈｉｊｋｌｍｎｏｐｑｒｓｔｕｖｗｘｙｚ')}
      ];
      const entries = [];
      // Keep matching Regular and Bold entries next to each other.
      for (const variant of variants) {
        for(const family of families) {
          for(const [weight, fn] of [['Regular',family.regular],['Bold',family.bold]]) {
            entries.push({label:(variant.name?variant.name+' ':'')+family.name,weight,fn:text=>fn(variant.change(text))});
          }
        }
      }
      // Extra styles with their own Unicode alphabets. They're offered as
      // independent looks because Unicode doesn't provide matching bold sets.
      for(const style of specialty) {
        entries.push({label:style.name,weight:'',fn:style.fn});
        entries.push({label:'Airy '+style.name.toLowerCase(),weight:'',fn:text=>style.fn(letterspace(text,1))});
      }
      count.textContent = entries.length + ' styles';
      const ui = [];
      const fragment = document.createDocumentFragment();
      entries.forEach((item,index) => {
        const line = document.createElement('article');
        line.className = 'result';
        const meta = document.createElement('div');
        meta.className = 'meta';
        const label = document.createElement('span');
        label.className = 'font-label'; label.textContent = item.label;
        meta.append(label);
        if(item.weight){
          const dot = document.createElement('span');dot.className='dot';dot.setAttribute('aria-hidden','true');
          const weight=document.createElement('span');weight.className='weight-label';weight.textContent=item.weight;
          meta.append(dot,weight);
        }
        const main = document.createElement('div');main.className='result-main';
        const preview=document.createElement('p');preview.className='preview';preview.id='preview-'+index;
        const button=document.createElement('button');button.className='copy';button.type='button';
        button.textContent='Copy';button.setAttribute('aria-label','Copy '+item.label+(item.weight?' '+item.weight:''));
        button.addEventListener('click',()=>onCopy(item,button,preview));
        main.append(preview,button);line.append(meta,main);fragment.append(line);
        ui.push({item,preview,button});
      });
      container.append(fragment);
      let toastTimer,copyTimer,lastCopied=null;
      function update(){
        const value=input.value;
        const empty=!value.trim();
        for(const {item,preview,button} of ui){
          preview.textContent=empty?'Your words will appear here':item.fn(value);
          preview.classList.toggle('placeholder',empty);
          button.disabled=empty;
        }
      }
      async function copyText(value){
        if(navigator.clipboard&&window.isSecureContext){
          try{await navigator.clipboard.writeText(value);return true;}catch(e){}
        }
        const field=document.createElement('textarea');
        field.value=value;field.setAttribute('readonly','');
        field.style.cssText='position:fixed;left:-9999px;top:0;opacity:0;';
        document.body.append(field);field.select();field.setSelectionRange(0,value.length);
        let success=false;try{success=document.execCommand('copy');}catch(e){}
        field.remove();return success;
      }
      async function onCopy(item,button,preview){
        if(!input.value.trim())return;
        const copied=await copyText(item.fn(input.value));
        if(!copied){
          const selection=window.getSelection();selection.removeAllRanges();
          const range=document.createRange();range.selectNodeContents(preview);selection.addRange(range);
          showToast('Select the text to copy');return;
        }
        clearTimeout(copyTimer);
        if(lastCopied){lastCopied.classList.remove('copied');lastCopied.textContent='Copy';}
        lastCopied=button;button.classList.add('copied');button.textContent='Copied!';
        showToast('Copied to clipboard');
        copyTimer=setTimeout(()=>{button.classList.remove('copied');button.textContent='Copy';if(lastCopied===button)lastCopied=null;},1450);
      }
      function showToast(message){
        toast.textContent=message;toast.classList.add('show');
        clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),1650);
      }
      input.addEventListener('input',update);
      document.getElementById('clear').addEventListener('click',()=>{input.value='';update();input.focus();});
      update();
    })();
  </script>
</body>
</html>
